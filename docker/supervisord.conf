[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/sh -c "TARGET_PORT=${PORT:-80}; sed -i \"s/listen 80 default_server;/listen $TARGET_PORT default_server;/g\" /etc/nginx/http.d/default.conf && sed -i \"s/listen \\[::\\]:80 default_server;/listen \\[::\\]:$TARGET_PORT default_server;/g\" /etc/nginx/http.d/default.conf && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
